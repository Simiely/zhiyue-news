name: 更新新闻快照

# 构建期抓取：runner 里拉 RSS → 写 articles.csv → 生成静态 HTML → 提交回仓库。
# 浏览器访问 Pages 时读到的已经是渲染好的 HTML，不需要任何运行时 fetch / API / 数据库。
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时一次（UTC，错峰避开源站限流）
  workflow_dispatch:          # 也可在 Actions 页手动点 Run workflow
  push:
    paths:
      - 'feeds.json'
      - 'articles.csv'
      - 'build.py'
      - 'build_static.py'

permissions:
  contents: write             # 需要把生成的快照提交回仓库

concurrency:
  group: news-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取订阅源并生成页面
        # 每次跑都会落盘 CSV + 归档链接 + 按 7 天 TTL 清理正文。
        # 抓取失败不清空已有数据：merge() 保留上一版正文，links.csv 只追加。
        run: |
          python3 build.py --fetch-only --prune-days 7 || echo "::warning::部分订阅源抓取失败，沿用上一版数据"
          python3 build.py --offline --prune-days 7
          python3 build_static.py

      - name: 提交快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.csv links.csv index.html zaker-news.html
          # 只看数据文件是否真变了：HTML 里的构建时间戳每次都不同，
          # 若 articles.csv / links.csv 无 diff，说明这次没抓到新内容，跳过提交。
          if git diff --cached --quiet -- articles.csv links.csv; then
            git restore --staged . >/dev/null 2>&1 || true
            echo "数据无变化（HTML 仅构建时间戳更新），跳过提交"
          else
            git commit -m "chore: 更新新闻快照 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
